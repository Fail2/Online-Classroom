<!DOCTYPE html>
<html>
<head>
    <title>User Register</title>
</head>
<body>
    <h2>User Registration</h2>
    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'user-login' %}">Login here</a></p>
</body>
</html>
