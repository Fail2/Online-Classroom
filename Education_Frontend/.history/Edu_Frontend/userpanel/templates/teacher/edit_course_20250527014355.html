{% extends "teacher/base.html" %}

{% block title %}Edit Course{% endblock %}

{% block extra_css %}
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        padding: 50px;
    }

    .form-container {
        max-width: 600px;
        margin: auto;
        background: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        color: #333;
    }

    label {
        display: block;
        margin-top: 15px;
        color: #555;
    }

    input[type="text"],
    textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
        resize: vertical;
    }

    button {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    .back-link {
        display: block;
        margin-top: 15px;
        text-align: center;
        color: #555;
        text-decoration: none;
    }

    .back-link:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Edit Course</h2>
    <form method="POST">
        {% csrf_token %}
        <label for="title">Course Title:</label>
        <input type="text" id="title" name="title" value="{{ course.title }}" required>

        <label for="description">Course Description:</label>
        <textarea id="description" name="description" rows="5" required>{{ course.description }}</textarea>

        <button type="submit">Update Course</button>
        <a href="{% url 'teacher-home' %}" class="back-link">← Back to Dashboard</a>
    </form>
</div>
{% endblock %}
